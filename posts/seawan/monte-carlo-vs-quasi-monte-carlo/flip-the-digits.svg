<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Helvetica, Arial, sans-serif">
  <title>Making the 6th evenly spread dart by flipping digits</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
  <text x="20" y="35" font-size="18" fill="#111827" font-weight="bold">Dart number 6</text>
  <text x="20" y="80" font-size="17" fill="#2557a7">left–right:</text>
  <text x="140" y="80" font-size="17" fill="#111827">6 in base 2 is 110</text>
  <line x1="320" y1="74" x2="380" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="80" font-size="17" fill="#111827">flip: 0.011 → 0.375</text>
  <text x="20" y="130" font-size="17" fill="#c2410c">up–down:</text>
  <text x="140" y="130" font-size="17" fill="#111827">6 in base 3 is 20</text>
  <line x1="320" y1="124" x2="380" y2="124" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="130" font-size="17" fill="#111827">flip: 0.02 → 0.222</text>
  <rect x="20" y="160" width="600" height="60" rx="10" fill="#f3f4f6"/>
  <text x="320" y="197" font-size="18" fill="#111827" text-anchor="middle">So dart 6 lands at (0.375, 0.222). No dice needed!</text>
</svg>
