version: 1
deployment: domestic
sandbox:
  image: "PyTorch CUDA13 (GPU)"
  cpu: 2
  memory: 8Gi
  gpu: 1
  gpu_mem: 8000
  max_life: 60
upload: "."
setup: "pip install matplotlib"
command: "python experiment.py"
timeout: 2400
outputs:
  - results.csv
  - samples.json
  - learning.png
  - samples.png
