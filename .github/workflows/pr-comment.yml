# Posts the checklist from a "PR checks" run as one PR comment.
# Runs from the base branch with a write token, so it never checks out or runs PR code:
# the downloaded pr-report artifact is untrusted data, only read as files and passed with --body-file / --input.
name: PR comment

on:
  workflow_run:
    workflows: ["PR checks"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download pr-report
        uses: actions/download-artifact@v4
        with:
          name: pr-report
          path: ${{ runner.temp }}/pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the checklist comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/pr-report
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          marker='<!-- vibe-research-report -->'
          pr=$(head -c 20 "$REPORT/pr-number" | tr -d '[:space:]')
          if ! [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]]; then echo "::error::pr-number is not a PR number"; exit 1; fi
          # the artifact must belong to the PR whose head commit this run tested
          read -r pr_head n_files < <(gh api "repos/$GH_REPO/pulls/$pr" --jq '"\(.head.sha) \(.changed_files)"')
          if [ "$pr_head" != "$HEAD_SHA" ]; then echo "PR #$pr head is $pr_head, run tested $HEAD_SHA: skipping (stale run or mismatched artifact)"; exit 0; fi

          # trusted part first: from the event and the GitHub API, never from the artifact
          short_sha="${HEAD_SHA:0:7}"
          header() {
            echo "$marker"
            echo "## Vibe Research PR checks: $CONCLUSION"
            echo
            echo "Checked commit $short_sha. Run: $RUN_URL"
          }
          body="$RUNNER_TEMP/comment.md"
          {
            header
            echo
            echo "### Files outside \`posts/<user>/<slug>/\` (from the GitHub API)"
            echo
            if [ "$n_files" -ge 3000 ]; then
              echo "**Too many files ($n_files): the API lists at most 3000, inspect manually.**"
            else
              outside=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" --jq '.[] | .filename, (.previous_filename // empty)' | grep -Ev '^posts/[^/]+/[^/]+/.' | head -n 100 | head -c 8000 || true)
              if [ -z "$outside" ]; then echo "None."; else echo '~~~~~~~~text'; printf '%s\n' "$outside" | tr -d '~'; echo '~~~~~~~~'; fi
            fi
            echo
            echo '---'
            echo
            echo "_Content below was produced by the PR's own CI run and is not trusted._"
            echo
            # untrusted checklist, capped and shown verbatim with its backticks replaced, so a fixed fence always holds
            head -c 40000 "$REPORT/checklist.md" | tr '`' "'" > "$RUNNER_TEMP/checklist.txt"
            echo '```markdown'
            cat "$RUNNER_TEMP/checklist.txt"
            echo
            echo '```'
          } > "$body"

          id=$(gh api --paginate "repos/$GH_REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          post() {
            if [ -n "$id" ]; then
              jq -Rs '{body: .}' "$1" > "$RUNNER_TEMP/payload.json" &&
                gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" --input "$RUNNER_TEMP/payload.json" > /dev/null
            else
              gh pr comment "$pr" --body-file "$1"
            fi
          }
          if post "$body"; then
            echo "posted checklist on PR #$pr (comment ${id:-new})"
          else
            # never leave a stale comment: replace it with the trusted part only
            short="$RUNNER_TEMP/comment-short.md"
            { header; echo; echo "**Full report too large/failed: see the run at $RUN_URL**"; } > "$short"
            post "$short"
            echo "::warning::full checklist could not be posted; posted the short trusted-only comment"
          fi
